<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Shiny Jewels</title>

      <script src="https://cdn.tailwindcss.com"></script>

      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

      <style>
            @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap');

            * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
            }

            .playfair-font {
                  font-family: "Playfair Display", serif;
            }

            .raleway-font {
                  font-family: "Raleway", sans-serif;
            }
      </style>
</head>

<body class="bg-gray-100 min-h-screen">
      <header class="w-full">
            <!-- Top Bar Section -->
            <section
                  class="w-full bg-[#1c0003] border-b border-[#4d0c14] relative bg-center bg-cover px-4 sm:px-8 md:px-12 lg:px-16 py-4 sm:py-5"
                  style="background-image: url('images/top-bar-img/topbar-bg.png');">

                  <!-- Flex Container -->
                  <div
                        class="w-full flex flex-col md:flex-row items-center justify-between gap-4 md:gap-0 relative min-h-[52px]">

                        <!-- Left: Address Capsule -->
                        <div
                              class="flex items-center gap-2.5 bg-[#470018]/90 border border-[#eebe62]/90 px-4 py-1.5 rounded-full shadow-[inset_0_1px_3px_rgba(0,0,0,0.8)] shrink-0 z-10 order-2 md:order-1 p-4">
                              <i class="fa-solid fa-location-dot text-[#eebe62] text-sm shrink-0"></i>
                              <span
                                    class="raleway-font text-[#e0cfc8] text-xs md:text-[13px] font-normal tracking-wide whitespace-nowrap">
                                    Jadupur, Purba Medinipur, West Bengal - 721641
                              </span>
                        </div>

                        <!-- Center: Ornate Gold Frame & Tagline (Perfect Fit, No Overflow) -->
                        <div
                              class="order-1 md:order-2 md:absolute md:left-1/2 md:top-1/2 md:-translate-x-1/2 md:-translate-y-1/2 relative flex items-center justify-center w-[260px] sm:w-[300px] md:w-[340px] pointer-events-none z-10 shrink-0 ">

                              <!-- Ornate Frame Image -->
                              <img src="images/top-bar-img/top-frame.png" alt="Ornate Frame"
                                    class="w-full h-auto block filter drop-shadow">

                              <!-- Center Text perfectly inside frame bounds -->
                              <span
                                    class="absolute inset-0 flex items-center justify-center text-[8.5px] sm:text-[10px] md:text-[11px] text-[#fbf0dc] raleway-font font-medium tracking-wide whitespace-nowrap px-8 select-none">
                                    Timeless Beauty. Precious Forever.
                              </span>

                        </div>

                        <!-- Right: Contact & Socials Capsule -->
                        <div
                              class="flex items-center gap-3 bg-[#470018]/90 border border-[#eebe62]/90 px-4 py-1.5 rounded-full shadow-[inset_0_1px_3px_rgba(0,0,0,0.8)] shrink-0 z-10 order-3">

                              <!-- Phone -->
                              <a href="tel:7047119767"
                                    class="flex items-center gap-1.5 text-[#e0cfc8] hover:text-[#eebe62] transition-colors">
                                    <i class="fa-solid fa-phone text-[#eebe62] text-xs"></i>
                                    <span
                                          class="raleway-font text-xs md:text-[13px] font-normal tracking-wider">7047119767</span>
                              </a>

                              <!-- Divider -->
                              <span class="text-[#eebe62]/50 text-sm select-none">|</span>

                              <!-- Socials -->
                              <div class="flex items-center gap-2">
                                    <span class="raleway-font text-[#cbb6ad] text-xs hidden lg:inline font-light">Follow
                                          Us:</span>

                                    <!-- Facebook -->
                                    <a href="#"
                                          class="w-[22px] h-[22px] rounded-full bg-[#eebe62] text-[#2b0005] flex items-center justify-center hover:bg-[#ffc107] hover:scale-105 transition-all text-[11px]">
                                          <i class="fa-brands fa-facebook-f"></i>
                                    </a>

                                    <!-- Instagram -->
                                    <a href="#"
                                          class="w-[22px] h-[22px] rounded-full bg-[#eebe62] text-[#2b0005] flex items-center justify-center hover:bg-[#ffc107] hover:scale-105 transition-all text-[11px]">
                                          <i class="fa-brands fa-instagram"></i>
                                    </a>

                                    <!-- YouTube -->
                                    <a href="#"
                                          class="w-[22px] h-[22px] rounded-full bg-[#eebe62] text-[#2b0005] flex items-center justify-center hover:bg-[#ffc107] hover:scale-105 transition-all text-[10px]">
                                          <i class="fa-brands fa-youtube"></i>
                                    </a>
                              </div>

                        </div>

                  </div>
            </section>
            <!-- Navbar section -->
            <nav class="w-full relative bg-[#faeedb] bg-no-repeat bg-[length:100%_100%] border-b border-[#e2caa0]/60 select-none"
                  style="background-image: url('images/navbar-img/navbar-bg.png');">
                  <div
                        class="max-w-[1440px] mx-auto px-4 sm:px-8 lg:px-12 flex items-center justify-between h-[85px] sm:h-[95px] md:h-[105px] relative">

                        <!-- Left Menu -->
                        <div class="hidden lg:flex items-center gap-5 xl:gap-7">

                              <!-- Home Button -->
                              <a href="#"
                                    class="relative flex items-center justify-center w-[95px] xl:w-[105px] h-[36px] transition-transform hover:scale-105 shrink-0">
                                    <img src="images/navbar-img/btn-bg.png" alt="Home"
                                          class="absolute inset-0 w-full h-full object-fill drop-shadow">
                                    <span
                                          class="relative z-10 text-white raleway-font font-medium text-[13.5px] tracking-wide pt-0.5">Home</span>
                              </a>

                              <!-- Links -->
                              <div
                                    class="flex items-center gap-3.5 xl:gap-5 text-[#951416] raleway-font font-medium text-[14px] xl:text-[15px]">
                                    <a href="#" class="hover:text-[#8e1b26] transition-colors whitespace-nowrap">About
                                          us</a>
                                    <span class="text-[#da0f12]/80 select-none">|</span>

                                    <div
                                          class="relative group cursor-pointer flex items-center gap-1 hover:text-[#8e1b26] transition-colors whitespace-nowrap">
                                          <span>Collections</span>
                                          <i
                                                class="fa-solid fa-chevron-down text-[9px] text-[#951416] group-hover:rotate-180 transition-transform duration-200"></i>
                                    </div>
                                    <span class="text-[#da0f12]/80 select-none">|</span>

                                    <a href="#" class="hover:text-[#8e1b26] transition-colors whitespace-nowrap">Gold
                                          Rate</a>
                              </div>

                        </div>

                        <!-- Center: Overlapping Circular Logo -->
                        <div
                              class="absolute left-1/2 top-0 -translate-x-1/2 z-30 flex items-center justify-center pointer-events-auto">
                              <a href="#"
                                    class="w-[82px] h-[82px] sm:w-[96px] sm:h-[96px] md:w-[110px] md:h-[110px] rounded-full bg-white shadow-[0_8px_20px_rgba(0,0,0,0.18)] border-[2.5px] border-[#ecd29f] p-2 flex items-center justify-center transition-transform hover:scale-105">
                                    <img src="images/navbar-img/PUSHPAM JEWELLERS LOGO (1) 2.png"
                                          alt="PUSHPAM JEWELLERS" class="w-full h-full object-contain">
                              </a>
                        </div>

                        <!-- Right Menu & Actions -->
                        <div class="hidden lg:flex items-center gap-5 xl:gap-7">

                              <!-- Links -->
                              <div
                                    class="flex items-center gap-3.5 xl:gap-5 text-[#951416] raleway-font font-medium text-[14px] xl:text-[15px]">
                                    <a href="#"
                                          class="hover:text-[#8e1b26] transition-colors whitespace-nowrap">Customer
                                          Jewellery</a>
                                    <span class="text-[#da0f12]/80 select-none">|</span>

                                    <a href="#"
                                          class="hover:text-[#8e1b26] transition-colors whitespace-nowrap">Gallery</a>
                                    <span class="text-[#da0f12]/80 select-none">|</span>

                                    <a href="#" class="hover:text-[#8e1b26] transition-colors whitespace-nowrap">Contact
                                          Us</a>
                              </div>

                              <!-- Icons -->
                              <div class="flex items-center gap-4 pl-3">

                                    <!-- Search Icon -->
                                    <button class="text-[#7d111d] hover:text-[#dfa135] transition-colors p-1"
                                          title="Search">
                                          <svg class="w-6 h-6 stroke-current stroke-[2.2] fill-none"
                                                viewBox="0 0 24 24">
                                                <circle cx="11" cy="11" r="7"></circle>
                                                <line x1="16.5" y1="16.5" x2="21.5" y2="21.5" stroke-linecap="round">
                                                </line>
                                          </svg>
                                    </button>

                                    <!-- Custom Login Icon with Floating Gold Badge -->
                                    <a href="#"
                                          class="relative flex flex-col items-center group transition-transform hover:scale-105 pt-1"
                                          title="Login">

                                          <!-- Login SVG Icon (Arrow entering arc) -->
                                          <svg class="w-7 h-7 text-[#7d111d] fill-none stroke-current stroke-[2.5]"
                                                viewBox="0 0 28 28">
                                                <!-- Entering Arrow -->
                                                <line x1="4" y1="14" x2="19" y2="14" stroke-linecap="round"></line>
                                                <polyline points="14 9 19 14 14 19" stroke-linecap="round"
                                                      stroke-linejoin="round"></polyline>
                                                <!-- Right Outer Arc -->
                                                <path d="M 18 5 A 10 10 0 0 1 18 23" stroke-linecap="round"></path>
                                          </svg>

                                          <!-- Floating Golden Login Pill Badge -->
                                          <span
                                                class="absolute top-[26px] bg-gradient-to-b from-[#e5aa42] to-[#bf7e1b] text-[#1a0004] text-[10px] font-semibold tracking-tight px-2 py-0.5 rounded-full shadow-[0_3px_6px_rgba(0,0,0,0.25)] whitespace-nowrap raleway-font z-20">
                                                Login
                                          </span>
                                    </a>

                              </div>
                        </div>

                        <!-- Mobile & Tablet Layout -->
                        <div class="flex lg:hidden items-center justify-between w-full">
                              <button class="text-[#951416] text-xl p-1 focus:outline-none" aria-label="Open Menu">
                                    <i class="fa-solid fa-bars"></i>
                              </button>

                              <div class="flex items-center gap-3.5">
                                    <button class="text-[#951416] text-base">
                                          <i class="fa-solid fa-magnifying-glass"></i>
                                    </button>
                                    <a href="#" class="flex flex-col items-center text-[#951416]">
                                          <i class="fa-solid fa-arrow-right-to-bracket text-base"></i>
                                          <span class="text-[8px] font-bold uppercase">LOGIN</span>
                                    </a>
                              </div>
                        </div>

                  </div>
            </nav>
      </header>
</body>

</html>
